[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api calls to the Render backend (avoids CORS and hardcoded URLs)
[[redirects]]
  from   = "/api/*"
  to     = "https://ai-journal-system.onrender.com/api/:splat"
  status = 200
  force  = true

# Fallback: serve React SPA for all other routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
