[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api calls and /health to the Render backend
[[redirects]]
  from   = "/health"
  to     = "https://ai-journal-system.onrender.com/health"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/*"
  to     = "https://ai-journal-system.onrender.com/api/:splat"
  status = 200
  force  = true

[context.production.environment]
  VITE_API_URL = ""

# Fallback: serve React SPA for all other routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
